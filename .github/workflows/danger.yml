name: CI Pull Requests
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: "16"
          cache: yarn
      - uses: actions/cache@v3
        id: cache
        with:
          path: |
            ${{ github.workspace }}/node_modules
            ${{ github.workspace }}/.next
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}
      - name: yarn install
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: yarn lint
        run: yarn lint
      - name: yarn build
        run: yarn build
        env:
          CONTENTFUL_SPACE_ID: hqzw548gixsa
          CONTENTFUL_ACCESS_TOKEN: 3iXt55h67JDRfrIxFUXv3i4lR73nZNFyJoY6YQT7Tn4
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: 7LQY0TVkmUZEA22Wp9S0PI2fSbAgzy8zZM-qEWBy3a4
      - name: Danger
        run: yarn danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_TOKEN }}
